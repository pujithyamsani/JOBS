name: Update job board

on:
  schedule:
    # Every 2 hours from 6:45 AM to 10:45 PM India time (GitHub uses UTC times).
    # GitHub may start a scheduled run a little late when its servers are busy.
    - cron: "15 1-17/2 * * *"
  # "Run workflow" button on the Actions tab
  workflow_dispatch:
  # Also runs when you upload or edit the site, the settings or the collector
  push:
    branches: [main]
    paths:
      - index.html
      - config.json
      - collect_jobs.py
      - .github/workflows/update-jobs.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Collect new jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 collect_jobs.py

      - name: Save the job list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update job list"
            git pull --rebase --autostash
            git push
          fi

      - name: Prepare the website files
        run: |
          mkdir -p _site
          cp index.html jobs.json _site/

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
